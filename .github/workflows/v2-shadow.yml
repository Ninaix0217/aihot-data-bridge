name: AI HOT V2 Scheduled Shadow

on:
  schedule:
    - cron: "50 4 * * *"
    - cron: "10 5 * * *"

concurrency:
  group: aihot-v2-shadow
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record runner fallback start
        shell: bash
        run: echo "RUNNER_FALLBACK_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Resolve schedule and build V2 candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python -m aihot_bridge.shadow_v2 \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --event-schedule "${EVENT_SCHEDULE}" \
            --runner-fallback-started-at "${RUNNER_FALLBACK_STARTED_AT}" \
            --summary "${GITHUB_STEP_SUMMARY}"
