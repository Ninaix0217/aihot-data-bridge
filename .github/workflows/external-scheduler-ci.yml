name: External Scheduler CI

on:
  push:
    paths:
      - "external-scheduler/**"
      - ".github/workflows/external-scheduler-ci.yml"
  pull_request:
    paths:
      - "external-scheduler/**"
      - ".github/workflows/external-scheduler-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: external-scheduler
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: external-scheduler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
