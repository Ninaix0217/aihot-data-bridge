name: Daily Candidate Readiness

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aihot-snapshot-health
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Check daily repository candidate readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m aihot_bridge.repository_data health
          --repository "${{ github.repository }}"
          --branch snapshot-data
