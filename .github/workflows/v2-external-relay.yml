name: AI HOT V2 External Recovery Relay

on:
  push:
    branches:
      - aihot-scheduler-control
    paths:
      - ".aihot-control/trigger.json"

concurrency:
  group: aihot-v2-external-relay
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted relay code from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: code

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install relay runtime
        working-directory: code
        run: python -m pip install .

      - name: Validate immutable control event and dispatch fixed writer
        working-directory: code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_BEFORE: ${{ github.event.before }}
          CONTROL_AFTER: ${{ github.event.after }}
          CONTROL_ACTOR: ${{ github.actor }}
          CONTROL_ACTOR_ID: ${{ github.actor_id }}
        run: |
          python -m aihot_bridge.external_relay_v2 \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${CONTROL_REF}" \
            --before "${CONTROL_BEFORE}" \
            --after "${CONTROL_AFTER}" \
            --actor "${CONTROL_ACTOR}" \
            --actor-id "${CONTROL_ACTOR_ID}" \
            --summary "${GITHUB_STEP_SUMMARY}"
