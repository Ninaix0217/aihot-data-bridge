name: Snapshot and GitHub Pages

on:
  schedule:
    - cron: "50 4 * * *"
    - cron: "10 5 * * *"
  workflow_dispatch:

concurrency:
  group: aihot-daily-producer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      generated_at: ${{ steps.snapshot_metadata.outputs.generated_at }}
      report_date: ${{ steps.snapshot_metadata.outputs.report_date }}
      content_sha256: ${{ steps.snapshot_metadata.outputs.content_sha256 }}
      data_commit_sha: ${{ steps.data_readback.outputs.commit_sha }}
      data_blob_sha: ${{ steps.data_readback.outputs.blob_sha }}
    permissions:
      actions: read
      contents: write
      pages: read
    steps:
      - name: Capture workflow start
        id: producer_context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started_at="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.run_started_at // .created_at' 2>/dev/null || true
          )"
          if [[ -z "$started_at" ]]; then
            started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Build rolling candidate snapshot
        run: python -m aihot_bridge.snapshot --output dist/today.json

      - name: Validate snapshot artifact
        run: python -m aihot_bridge.snapshot --check dist/today.json

      - name: Validate and record snapshot metadata
        id: snapshot_metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from aihot_bridge.snapshot import load_snapshot

          today_path = Path("dist/today.json")
          daily_paths = sorted(Path("dist/report-candidate").glob("*.json"))
          if len(daily_paths) != 1:
              raise SystemExit(
                  f"expected exactly one daily candidate artifact, found {len(daily_paths)}"
              )
          daily_path = daily_paths[0]
          today_content = today_path.read_bytes()
          daily_content = daily_path.read_bytes()
          if today_content != daily_content:
              raise SystemExit("today and daily candidate artifacts differ")

          payload = load_snapshot(today_path)
          daily_payload = load_snapshot(daily_path)
          if payload["generated_at"] != daily_payload["generated_at"]:
              raise SystemExit("today and daily candidate generated_at differ")

          coverage = payload["coverage"]
          summary = payload["summary"]
          content_sha256 = hashlib.sha256(today_content).hexdigest()
          report_date = daily_path.stem

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"generated_at={payload['generated_at']}\n")
              output.write(f"report_date={report_date}\n")
              output.write(f"content_sha256={content_sha256}\n")

          lines = [
              "## Snapshot build",
              "",
              f"- generated_at: `{payload['generated_at']}`",
              f"- daily_candidate: `report-candidate/{report_date}.json`",
              f"- artifact_sha256: `{content_sha256}`",
              "- today/daily byte-identical: `true`",
              f"- candidate_window: `[{payload['window']['from']}, {payload['window']['to']})`",
              f"- candidate_window_hours: `{payload['window']['hours']}`",
              f"- raw_items: `{summary['raw_items']}`",
              f"- deduplicated_items: `{summary['deduplicated_items']}`",
              "",
              "| channel | status | source | items |",
              "| --- | --- | --- | ---: |",
          ]
          for channel in ("selected", "all", "paper", "hot_topics", "daily"):
              entry = coverage[channel]
              lines.append(
                  f"| {channel} | {entry['status']} | {entry.get('source')} | {entry['items']} |"
              )

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary_file:
              summary_file.write("\n".join(lines) + "\n")
          PY

      - name: Prepare snapshot-data worktree
        id: data_worktree
        shell: bash
        env:
          DATA_ROOT: ${{ runner.temp }}/snapshot-data
        run: |
          if [[ -e "$DATA_ROOT" ]]; then
            echo "Refusing to reuse existing data worktree: $DATA_ROOT" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin snapshot-data >/dev/null 2>&1; then
            git fetch --no-tags origin snapshot-data
            git worktree add --detach "$DATA_ROOT" FETCH_HEAD
          else
            git worktree add --detach "$DATA_ROOT" HEAD
            git -C "$DATA_ROOT" switch --orphan snapshot-data
          fi
          echo "data_root=$DATA_ROOT" >> "$GITHUB_OUTPUT"

      - name: Stage validated repository candidate
        shell: bash
        env:
          DATA_ROOT: ${{ steps.data_worktree.outputs.data_root }}
          REPORT_DATE: ${{ steps.snapshot_metadata.outputs.report_date }}
        run: >-
          python -m aihot_bridge.repository_data stage
          --candidate "dist/report-candidate/${REPORT_DATE}.json"
          --data-root "$DATA_ROOT"

      - name: Commit and push snapshot-data
        id: data_publish
        shell: bash
        env:
          DATA_ROOT: ${{ steps.data_worktree.outputs.data_root }}
          REPORT_DATE: ${{ steps.snapshot_metadata.outputs.report_date }}
          GENERATED_AT: ${{ steps.snapshot_metadata.outputs.generated_at }}
        run: |
          git -C "$DATA_ROOT" config user.name "github-actions[bot]"
          git -C "$DATA_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DATA_ROOT" add -- "report-candidate/${REPORT_DATE}.json" latest.json

          if git -C "$DATA_ROOT" diff --cached --quiet; then
            echo "Repository candidate is already current; no commit required."
          else
            git -C "$DATA_ROOT" commit -m \
              "Publish AI HOT candidate ${REPORT_DATE} ${GENERATED_AT} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi

          git -C "$DATA_ROOT" push origin HEAD:refs/heads/snapshot-data
          commit_sha="$(git -C "$DATA_ROOT" rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Verify snapshot-data repository object
        id: data_readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.snapshot_metadata.outputs.report_date }}
          GENERATED_AT: ${{ steps.snapshot_metadata.outputs.generated_at }}
          DATA_COMMIT_SHA: ${{ steps.data_publish.outputs.commit_sha }}
        run: >-
          python -m aihot_bridge.repository_data verify-remote
          --repository "${{ github.repository }}"
          --branch snapshot-data
          --path "report-candidate/${REPORT_DATE}.json"
          --candidate "dist/report-candidate/${REPORT_DATE}.json"
          --expected-generated-at "$GENERATED_AT"
          --expected-commit-sha "$DATA_COMMIT_SHA"
          --attempts 5
          --interval-seconds 3

      - name: Write producer run summary
        if: always()
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_STARTED_AT: ${{ steps.producer_context.outputs.started_at }}
          DATA_COMMIT_SHA: ${{ steps.data_publish.outputs.commit_sha }}
          CANDIDATE_BLOB_SHA: ${{ steps.data_readback.outputs.blob_sha }}
          REPOSITORY_READBACK_OUTCOME: ${{ steps.data_readback.outcome }}
          REPORT_DATE: ${{ steps.snapshot_metadata.outputs.report_date }}
        run: >-
          python -m aihot_bridge.producer_summary
          --candidate "dist/report-candidate/${REPORT_DATE}.json"
          --event-name "$EVENT_NAME"
          --event-schedule "$EVENT_SCHEDULE"
          --workflow-started-at "$WORKFLOW_STARTED_AT"
          --data-commit-sha "$DATA_COMMIT_SHA"
          --candidate-blob-sha "$CANDIDATE_BLOB_SHA"
          --repository-readback-outcome "$REPOSITORY_READBACK_OUTCOME"

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Report snapshot build failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Snapshot build"
            echo
            echo "- Result: \`FAILED\`"
            echo "- The previous Pages snapshot was not replaced."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before one deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Require a successful deployment
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment_retry.outcome != 'success'
        run: exit 1

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          {
            echo "## GitHub Pages deployment"
            echo
            echo "- Primary attempt: \`${{ steps.deployment.outcome }}\`"
            echo "- Retry attempt: \`${{ steps.deployment_retry.outcome || 'not-needed' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Verify dated consumer and canonical parity
        run: >-
          python -m aihot_bridge.freshness
          https://ninaix0217.github.io/aihot-data-bridge/today.json
          --matching-url
          https://ninaix0217.github.io/aihot-data-bridge/report-candidate/${{ needs.build.outputs.report_date }}.json
          --max-age-minutes 90
          --expected-generated-at "${{ needs.build.outputs.generated_at }}"
          --expected-sha256 "${{ needs.build.outputs.content_sha256 }}"
          --attempts 36
          --interval-seconds 20
          --timeout-seconds 10
